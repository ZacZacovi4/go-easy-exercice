name: go-easy
services:
  db:
    image: mariadb:11
    container_name: db
    env_file:
      - ./db/.env
    volumes:
      - db_data:/var/lib/mysql
      - ./db/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - go-easy.net

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    networks:
      - go-easy.net

  front-office:
    build:
      context: ./front-office
    container_name: front-office
    depends_on:
      - backend
    networks:
      - go-easy.net

  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - backend
      - front-office
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - go-easy.net

volumes:
  db_data:

networks:
  go-easy.net:
    driver: bridge
